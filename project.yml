name: SoHoaDon
options:
  bundleIdPrefix: com.nje
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  SoHoaDon:
    type: application
    platform: iOS
    sources:
      - SoHoaDonApp.swift
      - ContentView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nje.sohoadon
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Sổ Hóa Đơn"
        CFBundleName: "Sổ Hóa Đơn"
        NSFaceIDUsageDescription: "Dùng Face ID để khoá hoá đơn của anh."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
