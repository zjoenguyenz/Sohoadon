name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, testb ]

jobs:
  build:
    # TestB can SDK iOS 26 (Xcode 26). Runner macos-26 khong cap duoc
    # may (2 lan job bi huy khi chua chay) nen chay tren macos-15 — tren
    # image nay co san Xcode 26.0.1-26.3 (mac dinh la 16.4), buoc duoi
    # tu chon ban Xcode 26 moi nhat tren may.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting Xcode: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Discover project and scheme
        run: |
          PROJ=$(ls -d *.xcodeproj | head -1)
          NAME=$(basename "$PROJ" .xcodeproj)
          echo "Discovered project: $PROJ (scheme: $NAME)"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Build app (signing disabled)
        run: |
          xcodebuild build \
            -project "$PROJ" \
            -scheme "$NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload "$NAME-unsigned.ipa"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$NAME-unsigned.ipa" Payload
          ls -lh "$NAME-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-IPA
          path: ${{ env.NAME }}-unsigned.ipa
          retention-days: 30
