name: Build unsigned IPA

# ============================================================
# BẢN SOẠN SẴN CHO NHÁNH v3 (Pha 4 — staging, CHƯA đẩy).
# Lệch so với workflow hiện hành trên main:
#  1. Kích hoạt trên nhánh `v3` (+ workflow_dispatch) để CI biên
#     dịch CẢ HAI target ngay từ lần đẩy đầu — đây là cổng đóng
#     điều kiện C2 (biên dịch Swift thật) của cốt lõi v3.
#  2. Build TƯỜNG MINH hai scheme (SoHoaDon + SoHoaDonBench) và
#     đóng gói IPA RIÊNG cho từng .app. Workflow cũ lấy .app đầu
#     tiên tìm thấy trong Release-iphoneos (head -1) — với hai
#     target, cách đó chọn app tuỳ tiện, cấm dùng lại.
#  3. Tên artifact: run number + NGÀY CHẠY THẬT (date +%F) thay
#     ngày cứng "2026-11-10" của bản cũ (B2 Điều 3: tên duy nhất
#     kèm run + ngày).
# Khi v3 được duyệt nhập về main, Leader nối lại danh sách
# branches [main, testb] vào file này qua cùng đường trình duyệt.
# ============================================================

on:
  workflow_dispatch:
  push:
    branches: [ v3 ]

jobs:
  build:
    # macos-26 = Xcode 26: can cho TestB (SDK iOS 26); app chinh build
    # duoi Xcode 26 van duoc (deployment target nam o project.yml).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Discover project
        run: |
          PROJ=$(ls -d *.xcodeproj | head -1)
          NAME=$(basename "$PROJ" .xcodeproj)
          echo "Discovered project: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "RUN_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build main app (scheme SoHoaDon, signing disabled)
        run: |
          xcodebuild build \
            -project "$PROJ" \
            -scheme "SoHoaDon" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DD-main \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build bench app (scheme SoHoaDonBench, signing disabled)
        run: |
          xcodebuild build \
            -project "$PROJ" \
            -scheme "SoHoaDonBench" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DD-bench \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPAs
        run: |
          set -e
          package() {
            DD="$1"; APPNAME="$2"; OUT="$3"
            APP_PATH=$(find "$DD/Build/Products/Release-iphoneos" -maxdepth 1 -name "$APPNAME.app" | head -1)
            echo "App: $APP_PATH"
            test -n "$APP_PATH"
            rm -rf Payload "$OUT"
            mkdir Payload
            cp -R "$APP_PATH" Payload/
            zip -qry "$OUT" Payload
            rm -rf Payload
            ls -lh "$OUT"
          }
          package build/DD-main SoHoaDon "SoHoaDon-unsigned.ipa"
          package build/DD-bench SoHoaDonBench "SoHoaDonBench-unsigned.ipa"

      - name: Upload main IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoHoaDon-V3-run${{ github.run_number }}-${{ env.RUN_DATE }}
          path: SoHoaDon-unsigned.ipa
          retention-days: 30

      - name: Upload bench IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoHoaDon-BENCH-V3-run${{ github.run_number }}-${{ env.RUN_DATE }}
          path: SoHoaDonBench-unsigned.ipa
          retention-days: 30
