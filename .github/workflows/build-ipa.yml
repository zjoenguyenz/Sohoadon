name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (signing disabled)
        run: |
          xcodebuild build \
            -project SoHoaDon.xcodeproj \
            -scheme SoHoaDon \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload SoHoaDon-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SoHoaDon-unsigned.ipa Payload
          ls -lh SoHoaDon-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoHoaDon-IPA
          path: SoHoaDon-unsigned.ipa
          retention-days: 30
