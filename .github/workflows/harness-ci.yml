# HARNESS CI — cổng kiểm chứng của LUẬT 2026-11-12.
#
# CHỈ CHẠY THỦ CÔNG (workflow_dispatch) — lệnh chủ tài
# khoản 2026-11-12 23:48 CST: chế độ tự kích hoạt theo
# push đã bị BỎ vì đốt hạn mức Actions (tháng 11/2026
# Sohoadon tốn $17.57 trong $18 miễn phí gói Pro, phần
# lớn do workflow này tự chạy theo mỗi lần đẩy code).
# Runner macOS $0.08/phút; một lượt toàn phần ≈ 76 phút
# ≈ $6 — chỉ bấm chạy khi thật sự tới CỔNG QUYẾT ĐỊNH
# (trước patch lớn). Luật 100 lượt KHÔNG đổi: cổng vẫn
# phải chạy và xanh hẳn trước khi giao bản.
#
# FILE NHÁP: muốn hiệu lực phải nằm ở .github/workflows/
# harness-ci.yml trong repo. Connector GitHub KHÔNG đẩy được
# .github/workflows/* (403 — đã chứng minh) nên Leader cài
# file này qua đường trình duyệt như mọi lần sửa workflow.
#
# Ba cổng, đỏ ở đâu dừng ở đó:
#   1. control  — parse luồng ĐÃ GHI L-R01 bằng Swift thật
#                 (đối chứng audit: phải SURVIVED).
#   2. law      — 33 ảnh x 100 set liên tiếp qua Vision macOS
#                 + assemble + parse + scoring, cấu hình mặc
#                 định BenchShell run #46 (old + top-1).
#                 Một crash ở bất kỳ lượt nào = job đỏ.
#   3. fuzz     — bẫy đột biến trên luồng ghi, mỗi đột biến
#                 một process riêng; process chết vì signal
#                 = TÁI HIỆN ĐƯỢC = job đỏ + ghi rõ id.
name: Harness — cổng tự chạy 100 lượt

on:
  workflow_dispatch:
    inputs:
      job:
        description: "full = ca 3 cong (mac dinh) | streams = chi cong luong V4-0"
        type: choice
        options:
          - full
          - streams
        default: full

jobs:
  law-and-control:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Xcode: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Sinh project harness
        run: cd harness && xcodegen generate --spec project-harness.yml
      - name: Build harness (Release)
        run: |
          set -o pipefail
          xcodebuild -project harness/SoHoaDonHarness.xcodeproj \
            -scheme SoHoaDonHarness -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath harness/dd build 2>&1 | tee build.log | tail -20
          BIN=$(find harness/dd/Build/Products -name SoHoaDonHarness -type f -not -path "*.dSYM*" | head -1)
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          cp vendors.json lexicon.json "$(dirname "$BIN")/"
      - name: Probe (ngôn ngữ + dữ liệu nạp thật)
        run: |
          set -o pipefail
          "$BIN" probe | tee probe.log
          ! grep -q "unloaded" probe.log
      - name: Cổng G1 — unit tests (logic thuần + vòng đời nháp)
        run: |
          set -o pipefail
          "$BIN" unittests 2>&1 | tee unittests.log
          grep -q "SURVIVED unittests" unittests.log
      - name: Cổng 1 — control trên luồng đã ghi L-R01
        run: |
          set -o pipefail
          "$BIN" fixture harness/fixtures/L-R01-raw-a-original.json 2>&1 | tee control.log
          grep -q "SURVIVED fixture" control.log
      - name: Truy vết bisect (chỉ khi cổng control đỏ)
        if: failure()
        run: |
          if [ -x "$BIN" ]; then
            "$BIN" bisect harness/fixtures/L-R01-raw-a-original.json 2>&1 | tee bisect.log
          else
            echo "BIN không chạy được — bỏ qua bisect" | tee bisect.log
          fi
      - name: Chẻ biến thể dòng chết (chỉ khi cổng control đỏ)
        if: failure()
        run: |
          if [ -x "$BIN" ]; then
            "$BIN" variants harness/fixtures/L-R01-raw-a-original.json 2>&1 | tee variants.log
          else
            echo "BIN không chạy được — bỏ qua variants" | tee variants.log
          fi
      - name: Cổng 2 — LUẬT 100 lượt (33 ảnh x 100 set)
        if: inputs.job == 'full'
        run: |
          "$BIN" images --dir BenchImages --sets 100 --dump streams 2>&1 | tee images.log
          grep -q "SURVIVED images x100" images.log
      - name: Ma trận cấu hình phụ (3 set mỗi tổ hợp còn lại)
        if: inputs.job == 'full'
        run: |
          for cfg in "current 1" "current 3" "old 3" "enus 1"; do
            set -- $cfg
            "$BIN" images --dir BenchImages --sets 3 --lang "$1" --topk "$2" 2>&1 \
              | tee "matrix-$1-$2.log"
            grep -q "SURVIVED images x3" "matrix-$1-$2.log"
          done
      - name: Cổng 3 — bẫy đột biến (mỗi ca một process)
        if: inputs.job == 'full'
        run: |
          : > fuzz-results.txt
          "$BIN" fuzz harness/fixtures/L-R01-raw-a-original.json --list > fuzz-ids.txt
          while read -r id; do
            [ -z "$id" ] && continue
            if "$BIN" fuzz harness/fixtures/L-R01-raw-a-original.json "$id" > "fuzz-$id.log" 2>&1 \
               && grep -q "SURVIVED $id" "fuzz-$id.log"; then
              echo "PASS $id" >> fuzz-results.txt
            else
              echo "DIED $id (exit=$?)" >> fuzz-results.txt
            fi
          done < fuzz-ids.txt
          cat fuzz-results.txt
          ! grep -q "^DIED" fuzz-results.txt
      - name: Cổng luồng — V4-0 (chỉ khi job=streams)
        if: inputs.job == 'streams'
        run: |
          set -o pipefail
          "$BIN" streams --dir harness/streams 2>&1 | tee streams.log
          grep -q "STREAMS-DONE" streams.log
      - name: Lưu bằng chứng (luồng thật + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence-${{ github.run_number }}
          path: |
            build.log
            streams/
            probe.log
            unittests.log
            control.log
            bisect.log
            variants.log
            images.log
            matrix-*.log
            fuzz-results.txt
            streams.log
            fuzz-*.log
